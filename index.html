<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幸運大抽獎</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10111d;
    --panel: #191b2c;
    --panel2: #20233a;
    --text: #f7f7ff;
    --muted: #a8abc5;
    --accent: #9b8cff;
    --accent2: #ff6fb5;
    --border: rgba(255,255,255,.11);
    --danger: #ff6b78;
    --success: #69e6bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(105,88,220,.22), transparent 35%),
      radial-gradient(ellipse at 90% 15%, rgba(255,87,166,.13), transparent 32%),
      var(--bg);
  }
  button, textarea, input, select { font: inherit; }
  button { cursor: pointer; border: 0; transition: transform .15s, opacity .15s, filter .15s; }
  button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  button:disabled { cursor: not-allowed; opacity: .45; }
  .app { max-width: 1220px; margin: auto; padding: 28px 18px 44px; }
  header { text-align: center; margin-bottom: 26px; }
  .eyebrow { color: #c3baff; font-size: .78rem; font-weight: 800; letter-spacing: .22em; }
  h1 { font-size: clamp(2rem, 5vw, 3.4rem); margin: 7px 0 5px; letter-spacing: .03em; }
  .subtitle { color: var(--muted); margin: 0; }
  .layout { display: grid; grid-template-columns: minmax(270px, .85fr) minmax(340px, 1.15fr); gap: 20px; align-items: start; }
  .panel { background: linear-gradient(160deg, rgba(31,34,56,.96), rgba(23,25,41,.96)); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: 0 16px 45px rgba(0,0,0,.18); }
  .panel h2 { margin: 0 0 14px; font-size: 1.15rem; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .section-head h2 { margin: 0; }
  .count { background: rgba(155,140,255,.16); color: #d5ceff; padding: 5px 10px; border-radius: 999px; font-size: .82rem; white-space: nowrap; }
  textarea {
    display: block; width: 100%; min-height: 230px; resize: vertical;
    padding: 13px 14px; border: 1px solid var(--border); border-radius: 13px;
    background: #111321; color: var(--text); outline: none; line-height: 1.65;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(155,140,255,.13); }
  .hint { color: var(--muted); font-size: .82rem; line-height: 1.5; margin: 9px 0 15px; }
  .btn-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .btn { border-radius: 11px; padding: 10px 14px; font-weight: 750; }
  .btn-primary { color: #171326; background: linear-gradient(110deg, #b4a8ff, #ff9bcf); }
  .btn-secondary { color: var(--text); background: #30334d; border: 1px solid var(--border); }
  .btn-danger { color: #ffd8dc; background: rgba(255,107,120,.13); border: 1px solid rgba(255,107,120,.25); }
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 22px; }
  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .field label { color: #d9daec; font-size: .88rem; font-weight: 700; }
  input[type="number"], select {
    width: 100%; min-height: 42px; color: var(--text); background: #111321;
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; outline: none;
  }
  .check-field { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--border); border-radius: 12px; }
  .check-field input { accent-color: var(--accent); margin-top: 4px; width: 17px; height: 17px; }
  .check-field label { line-height: 1.4; font-size: .9rem; }
  .check-field small { display: block; color: var(--muted); font-weight: 400; margin-top: 3px; }
  .wheel-panel { text-align: center; }
  .wheel-wrap { position: relative; width: min(100%, 490px); margin: 5px auto 15px; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 12px 22px rgba(0,0,0,.3)); }
  .pointer {
    position: absolute; z-index: 2; left: 50%; top: -3px; transform: translateX(-50%);
    width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-top: 0; border-bottom: 34px solid #fff3a4; filter: drop-shadow(0 3px 4px #0008);
  }
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 23%; aspect-ratio: 1; border-radius: 50%; border: 5px solid #fff;
    background: linear-gradient(140deg, #ff9dca, #9d8cff 70%);
    box-shadow: 0 3px 15px #0005; display: grid; place-items: center;
    font-size: clamp(.65rem, 2vw, 1rem); font-weight: 1000; color: #241b3b; letter-spacing: .04em;
    pointer-events: none;
  }
  .spin-button { width: min(100%, 330px); padding: 15px 18px; border-radius: 14px; font-size: 1.08rem; font-weight: 900; color: #171326; background: linear-gradient(100deg, #b4a8ff, #ff9bcf); box-shadow: 0 8px 24px rgba(155,140,255,.18); }
  .status { min-height: 24px; color: var(--muted); margin: 13px 0 0; font-size: .9rem; }
  .status.error { color: #ff9ba5; }
  .status.success { color: var(--success); }
  .records { margin-top: 20px; }
  .records-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .records-head h2 { margin: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: .9rem; }
  th { color: var(--muted); font-size: .78rem; font-weight: 800; }
  td:first-child { color: #c9c4ff; width: 70px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 12px; }
  .footer-note { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 18px; line-height: 1.5; }
  .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; padding: 18px; z-index: 20; background: rgba(7,8,17,.78); backdrop-filter: blur(8px); }
  .modal-backdrop.show { display: grid; }
  .modal { position: relative; width: min(100%, 560px); max-height: min(85vh, 760px); overflow: auto; text-align: center; padding: 32px 24px 24px; border: 1px solid rgba(255,255,255,.2); border-radius: 24px; background: linear-gradient(145deg, #292644, #181a2c); box-shadow: 0 25px 90px #0009; animation: pop .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.82) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .trophy { font-size: 3rem; }
  .modal h2 { margin: 5px 0 6px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
  .modal-sub { color: var(--muted); margin: 0 0 18px; }
  .winner-list { display: grid; gap: 9px; margin: 18px 0 23px; }
  .winner-name { padding: 12px; border-radius: 12px; font-size: 1.2rem; font-weight: 850; background: linear-gradient(100deg, rgba(155,140,255,.18), rgba(255,111,181,.16)); border: 1px solid rgba(255,255,255,.12); overflow-wrap: anywhere; }
  .confetti-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 30; display: none; }
  .confetti-layer.show { display: block; }
  .confetti { position: absolute; top: -20px; width: 9px; height: 15px; opacity: .95; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(900deg); opacity: .85; } }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .wheel-wrap { width: min(100%, 440px); }
    textarea { min-height: 170px; }
  }
  @media (max-width: 420px) {
    .app { padding: 22px 12px 32px; }
    .panel { padding: 16px; border-radius: 17px; }
    .settings { grid-template-columns: 1fr; }
    .check-field { grid-column: auto; }
    .btn-row .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">LUCKY DRAW · GOOD LUCK</div>
    <h1>幸運大抽獎</h1>
    <p class="subtitle">把好運交給轉盤，看看下一位幸運兒是誰！</p>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="section-head">
        <h2>參加者名單</h2>
        <span class="count" id="participantCount">0 位參加者</span>
      </div>
      <label class="sr-only" for="nameList">參加者名單，每行一個名字</label>
      <textarea id="nameList" placeholder="請輸入參加者姓名，每行一個名字&#10;例如：&#10;陳小明&#10;林小華&#10;王小美"></textarea>
      <p class="hint">每行一個名額，空白行會自動忽略。相同姓名若出現多次，會視為不同抽獎名額。</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="applyListBtn">更新名單</button>
        <button class="btn btn-danger" id="clearListBtn">清空名單</button>
      </div>

      <div class="settings">
        <div class="field">
          <label for="winnerCount">每輪抽出人數</label>
          <input id="winnerCount" type="number" min="1" max="100" value="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="labelMode">轉盤姓名顯示</label>
          <select id="labelMode">
            <option value="auto">自動調整</option>
            <option value="full">盡量顯示全名</option>
          </select>
        </div>
        <div class="check-field">
          <input type="checkbox" id="allowRepeat">
          <label for="allowRepeat">允許重複中獎
            <small>勾選後，中獎者不會從參加者名單移除；取消勾選則會移除中獎名額。</small>
          </label>
        </div>
      </div>
    </section>

    <section class="panel wheel-panel">
      <h2>幸運大轉盤</h2>
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="900" height="900" aria-label="幸運抽獎轉盤"></canvas>
        <div class="hub">LUCKY!</div>
      </div>
      <button class="spin-button" id="spinBtn">開始抽獎</button>
      <p class="status" id="status" role="status" aria-live="polite">請先輸入參加者名單。</p>
    </section>
  </main>

  <section class="panel records">
    <div class="records-head">
      <div>
        <h2>中獎歷史紀錄</h2>
        <div class="hint" style="margin:5px 0 0">紀錄會保存在目前瀏覽器中，重新整理後仍可查看。</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="exportBtn">匯出 CSV</button>
        <button class="btn btn-danger" id="clearRecordsBtn">清除紀錄</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>輪次</th><th>抽獎時間</th><th>中獎姓名</th></tr></thead>
        <tbody id="recordBody"><tr><td colspan="3" class="empty">目前還沒有中獎紀錄。</td></tr></tbody>
      </table>
    </div>
  </section>
  <p class="footer-note">資料只儲存在這個瀏覽器的本機儲存空間，不會上傳至伺服器。清除瀏覽器網站資料可能會刪除保存內容。</p>
</div>

<div class="modal-backdrop" id="winnerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="trophy" aria-hidden="true">🏆</div>
    <h2 id="modalTitle">恭喜中獎！</h2>
    <p class="modal-sub" id="modalSub">幸運降臨！</p>
    <div class="winner-list" id="winnerList"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" id="continueBtn">繼續抽獎</button>
      <button class="btn btn-secondary" id="closeModalBtn">關閉</button>
    </div>
  </div>
</div>
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<script>
(() => {
  "use strict";
  const STORAGE_KEY = "luckyDrawAppState_v1";
  const COLORS = ["#ff6b8a", "#ffb454", "#ffe66d", "#58d6b4", "#58b9ff", "#9b8cff", "#e58bff", "#ff8ec7", "#7ce7e3", "#a8e063"];
  const $ = (id) => document.getElementById(id);
  const canvas = $("wheel");
  const ctx = canvas.getContext("2d");
  const nameListEl = $("nameList");
  const countEl = $("participantCount");
  const winnerCountEl = $("winnerCount");
  const allowRepeatEl = $("allowRepeat");
  const labelModeEl = $("labelMode");
  const spinBtn = $("spinBtn");
  const statusEl = $("status");
  const recordBody = $("recordBody");
  const modal = $("winnerModal");
  const winnerListEl = $("winnerList");
  const confettiLayer = $("confettiLayer");

  let participants = [];
  let records = [];
  let roundNumber = 0;
  let rotation = 0;
  let spinning = false;
  let modalTimer = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const state = JSON.parse(raw);
      if (Array.isArray(state.participants)) participants = state.participants.filter(x => typeof x === "string");
      if (Array.isArray(state.records)) records = state.records.filter(x => x && typeof x.name === "string");
      if (Number.isInteger(state.roundNumber) && state.roundNumber >= 0) roundNumber = state.roundNumber;
      nameListEl.value = Array.isArray(state.sourceNames) ? state.sourceNames.join("\n") : participants.join("\n");
      winnerCountEl.value = String(Math.max(1, Math.min(100, Number(state.winnerCount) || 1)));
      allowRepeatEl.checked = Boolean(state.allowRepeat);
      labelModeEl.value = state.labelMode === "full" ? "full" : "auto";
    } catch (error) {
      console.warn("無法讀取先前保存的抽獎資料。", error);
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        participants,
        records,
        roundNumber,
        sourceNames: parseNames(nameListEl.value),
        winnerCount: getRequestedCount(),
        allowRepeat: allowRepeatEl.checked,
        labelMode: labelModeEl.value
      }));
    } catch (error) {
      setStatus("無法保存資料，可能是瀏覽器儲存空間已滿或被停用。", "error");
    }
  }

  function parseNames(text) {
    return text.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
  }

  function setStatus(message, type = "") {
    statusEl.textContent = message;
    statusEl.className = "status" + (type ? " " + type : "");
  }

  function getRequestedCount() {
    const value = Number.parseInt(winnerCountEl.value, 10);
    return Number.isFinite(value) ? Math.max(1, Math.min(100, value)) : 1;
  }

  function updateCount() {
    countEl.textContent = `${participants.length} 位參加者`;
    spinBtn.disabled = spinning || participants.length === 0;
    drawWheel();
  }

  function syncListFromInput() {
    if (spinning) return;
    participants = parseNames(nameListEl.value);
    nameListEl.value = participants.join("\n");
    updateCount();
    saveState();
    setStatus(participants.length ? `名單已更新，共 ${participants.length} 個抽獎名額。` : "名單目前是空的，請先輸入參加者。", participants.length ? "success" : "");
  }

  function drawWheel() {
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2, radius = w * .455;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    const list = participants.length ? participants : ["請輸入名單"];
    const slice = Math.PI * 2 / list.length;

    for (let i = 0; i < list.length; i++) {
      const start = -Math.PI / 2 + i * slice;
      const end = start + slice;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = participants.length ? COLORS[i % COLORS.length] : "#44465f";
      ctx.fill();
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.stroke();

      if (participants.length) {
        ctx.save();
        ctx.rotate(start + slice / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        const maxFont = list.length > 50 ? 17 : list.length > 30 ? 20 : list.length > 18 ? 24 : 30;
        const fontSize = Math.min(maxFont, Math.max(12, radius * slice * .48));
        ctx.font = `800 ${fontSize}px system-ui, sans-serif`;
        ctx.fillStyle = "#21172f";
        ctx.shadowColor = "rgba(255,255,255,.25)";
        ctx.shadowBlur = 2;
        let label = list[i];
        const maxChars = labelModeEl.value === "full" ? 18 : (list.length > 28 ? 6 : list.length > 16 ? 9 : 14);
        if (label.length > maxChars) label = label.slice(0, Math.max(1, maxChars - 1)) + "…";
        ctx.fillText(label, radius * .88, 0, radius * .72);
        ctx.restore();
      }
    }
    ctx.restore();

    // Decorative outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
    ctx.lineWidth = 11;
    ctx.strokeStyle = "#f9e9ff";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 11, 0, Math.PI * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#9b8cff";
    ctx.stroke();
  }

  function randomInt(max) {
    if (max <= 0) return 0;
    if (window.crypto && window.crypto.getRandomValues) {
      const range = 0x100000000;
      const limit = range - (range % max);
      const array = new Uint32Array(1);
      let value;
      do { window.crypto.getRandomValues(array); value = array[0]; } while (value >= limit);
      return value % max;
    }
    return Math.floor(Math.random() * max);
  }

  function chooseWinners(pool, amount) {
    const copy = pool.slice();
    const winners = [];
    for (let i = 0; i < amount; i++) {
      const index = randomInt(copy.length);
      winners.push({ name: copy[index], poolIndex: index });
      copy.splice(index, 1);
    }
    return winners;
  }

  function animateSpin(finalRotation, duration) {
    return new Promise(resolve => {
      const startRotation = rotation;
      const delta = finalRotation - startRotation;
      const startTime = performance.now();
      function frame(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        // Ease-out cubic: fast start, smooth stop.
        const eased = 1 - Math.pow(1 - progress, 3);
        rotation = startRotation + delta * eased;
        drawWheel();
        if (progress < 1) requestAnimationFrame(frame);
        else { rotation = finalRotation % (Math.PI * 2); drawWheel(); resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  function rotationForIndex(index, total, extraTurns = 6) {
    const slice = Math.PI * 2 / total;
    // Pointer is at -PI/2 in screen coordinates. Align target slice center to that pointer.
    const desired = -Math.PI / 2 - (index + .5) * slice;
    const current = rotation;
    const normalizedCurrent = ((current % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const normalizedDesired = ((desired % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = normalizedDesired - normalizedCurrent;
    if (delta < 0) delta += Math.PI * 2;
    return current + extraTurns * Math.PI * 2 + delta;
  }

  async function spin() {
    if (spinning) return;
    if (participants.length === 0) {
      setStatus("請先輸入參加者名單，再開始抽獎。", "error");
      nameListEl.focus();
      return;
    }
    const amount = getRequestedCount();
    winnerCountEl.value = String(amount);
    if (amount > participants.length) {
      setStatus(`目前只有 ${participants.length} 個抽獎名額，無法一次抽出 ${amount} 人。`, "error");
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    $("applyListBtn").disabled = true;
    $("clearListBtn").disabled = true;
    winnerCountEl.disabled = true;
    allowRepeatEl.disabled = true;
    labelModeEl.disabled = true;
    setStatus("轉盤旋轉中，祝你好運！");
    const pool = participants.slice();
    const winners = chooseWinners(pool, amount);
    const first = winners[0];
    const target = rotationForIndex(first.poolIndex, pool.length, 6 + randomInt(4));
    try {
      await animateSpin(target, 4700 + randomInt(900));
      // For multiple winners, the wheel lands on the first winner; the entire batch is selected before animation.
      const timestamp = new Date().toISOString();
      roundNumber += 1;
      winners.forEach(winner => {
        records.unshift({ name: winner.name, time: timestamp, round: roundNumber });
      });
      if (!allowRepeatEl.checked) {
        // Remove each selected slot by index, not by name, so duplicate names remain distinct entries.
        const indexes = new Set(winners.map(w => w.poolIndex));
        participants = participants.filter((_, index) => !indexes.has(index));
        nameListEl.value = participants.join("\n");
      }
      renderRecords();
      updateCount();
      saveState();
      setStatus(`第 ${roundNumber} 輪完成！共抽出 ${winners.length} 位中獎者。`, "success");
      showWinners(winners, timestamp);
    } finally {
      spinning = false;
      $("applyListBtn").disabled = false;
      $("clearListBtn").disabled = false;
      winnerCountEl.disabled = false;
      allowRepeatEl.disabled = false;
      labelModeEl.disabled = false;
      updateCount();
      saveState();
    }
  }

  function formatTime(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return String(iso || "");
    return new Intl.DateTimeFormat("zh-TW", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hour12: false
    }).format(date);
  }

  function renderRecords() {
    recordBody.replaceChildren();
    if (!records.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 3; td.className = "empty"; td.textContent = "目前還沒有中獎紀錄。";
      tr.appendChild(td); recordBody.appendChild(tr); return;
    }
    records.forEach(record => {
      const tr = document.createElement("tr");
      const roundTd = document.createElement("td");
      const timeTd = document.createElement("td");
      const nameTd = document.createElement("td");
      roundTd.textContent = `第 ${record.round || "—"} 輪`;
      timeTd.textContent = formatTime(record.time);
      nameTd.textContent = record.name;
      tr.append(roundTd, timeTd, nameTd);
      recordBody.appendChild(tr);
    });
  }

  function showWinners(winners, timestamp) {
    winnerListEl.replaceChildren();
    winners.forEach((winner, index) => {
      const div = document.createElement("div");
      div.className = "winner-name";
      div.textContent = `${winners.length > 1 ? `${index + 1}. ` : ""}${winner.name}`;
      winnerListEl.appendChild(div);
    });
    $("modalSub").textContent = `${formatTime(timestamp)} · 共 ${winners.length} 位得獎者`;
    modal.classList.add("show");
    modalTimer = null;
    launchConfetti();
    $("continueBtn").focus();
  }

  function closeModal() {
    modal.classList.remove("show");
    stopConfetti();
    spinBtn.focus();
  }

  function launchConfetti() {
    stopConfetti();
    confettiLayer.classList.add("show");
    const fragment = document.createDocumentFragment();
    const colors = ["#ff5e8a", "#ffd166", "#06d6a0", "#4cc9f0", "#b197fc", "#ff9f1c", "#f8f7ff"];
    for (let i = 0; i < 150; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti";
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.backgroundColor = colors[randomInt(colors.length)];
      piece.style.animationDuration = `${2.8 + Math.random() * 3.8}s`;
      piece.style.animationDelay = `${Math.random() * 1.3}s`;
      piece.style.setProperty("--drift", `${Math.round((Math.random() - .5) * 260)}px`);
      piece.style.width = `${5 + Math.random() * 8}px`;
      piece.style.height = `${9 + Math.random() * 13}px`;
      if (Math.random() > .5) piece.style.borderRadius = "50%";
      fragment.appendChild(piece);
    }
    confettiLayer.appendChild(fragment);
  }

  function stopConfetti() {
    confettiLayer.classList.remove("show");
    confettiLayer.replaceChildren();
  }

  function clearList() {
    if (spinning) return;
    if (!confirm("確定要清空參加者名單嗎？中獎紀錄不會被刪除。")) return;
    participants = [];
    nameListEl.value = "";
    updateCount();
    saveState();
    setStatus("參加者名單已清空；中獎紀錄仍然保留。");
  }

  function clearRecords() {
    if (spinning) return;
    if (!records.length) {
      setStatus("目前沒有中獎紀錄可清除。");
      return;
    }
    if (!confirm("確定要清除所有中獎歷史紀錄嗎？此操作無法復原。")) return;
    records = [];
    renderRecords();
    saveState();
    setStatus("中獎紀錄已清除。", "success");
  }

  function exportCSV() {
    const rows = [["輪次", "抽獎時間", "中獎姓名"], ...records.map(r => [`第 ${r.round || ""} 輪`, formatTime(r.time), r.name])];
    const csv = "\uFEFF" + rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "中獎歷史紀錄.csv";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    setStatus("已匯出中獎歷史紀錄 CSV。", "success");
  }

  $("applyListBtn").addEventListener("click", syncListFromInput);
  $("clearListBtn").addEventListener("click", clearList);
  spinBtn.addEventListener("click", spin);
  $("clearRecordsBtn").addEventListener("click", clearRecords);
  $("exportBtn").addEventListener("click", exportCSV);
  $("continueBtn").addEventListener("click", closeModal);
  $("closeModalBtn").addEventListener("click", closeModal);
  modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && modal.classList.contains("show")) closeModal();
  });
  nameListEl.addEventListener("input", () => {
    if (!spinning) {
      const preview = parseNames(nameListEl.value);
      countEl.textContent = `${preview.length} 位參加者（待更新）`;
    }
  });
  winnerCountEl.addEventListener("change", () => {
    winnerCountEl.value = String(getRequestedCount());
    saveState();
  });
  allowRepeatEl.addEventListener("change", saveState);
  labelModeEl.addEventListener("change", () => { drawWheel(); saveState(); });

  loadState();
  updateCount();
  renderRecords();
  if (participants.length) setStatus(`已載入先前保存的名單，共 ${participants.length} 個抽獎名額。`, "success");
  else setStatus("請輸入參加者名單，再按「更新名單」。");
})();
</script>
</body>
</html>
